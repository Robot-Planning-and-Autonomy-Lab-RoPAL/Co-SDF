robot:
  type: RobotArm2D
  parameters:
    base_position: [5.0, 5.0]
    link_lengths: [2.1, 2.1]
workspace:
  type: Workspace2D
  parameters:
    limits: [[0.0, 10.0], [0.0, 10.0]]
    obstacles:
      # --- Polygons (3: Triangle, Pentagon, Hexagon) ---
      - type: Polygon # Triangle
        parameters:
          p_in: [[1.0, 7.5], [2.5, 9.5], [4.0, 7.5]]
      - type: Polygon # Pentagon
        parameters:
          p_in: [[1.5, 2.5], [0.8, 3.5], [1.5, 4.5], [2.5, 4.0], [2.5, 3.0]]
      - type: Polygon # Hexagon
        parameters:
          p_in: [[5.0, 2.3], [5.5, 0.9], [6.6, 0.9], [7.1, 2.3], [6.6, 3.7], [5.5, 3.7]]

      # --- Rectangles (5) ---
      - type: Rectangle
        parameters: {xlim: [0.5, 2.5], ylim: [5.5, 7.0]}
      - type: Rectangle
        parameters: {xlim: [2.5, 4.0], ylim: [8.0, 9.5]}
      - type: Rectangle
        parameters: {xlim: [7.0, 8.5], ylim: [7.0, 9.0]}
      - type: Rectangle
        parameters: {xlim: [8.5, 9.8], ylim: [6.0, 8.0]}
      - type: Rectangle
        parameters: {xlim: [2.0, 3.5], ylim: [1.0, 2.0]}

      # --- Circles (2) ---
      - type: Circle
        parameters: {center: [8.8, 4.0], radius: 1.2}
      - type: Circle
        parameters: {center: [7.5, 2.0], radius: 1.0}
