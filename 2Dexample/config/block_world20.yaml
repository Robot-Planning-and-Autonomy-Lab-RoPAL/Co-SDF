robot:
  type: RobotArm2D
  parameters:
    base_position: [5.0, 5.0]
    link_lengths: [2.1, 2.1]
workspace:
  type: Workspace2D
  parameters:
    limits: [[0.0, 10.0], [0.0, 10.0]]
    obstacles:
      # --- Polygons (6: 3 Triangles, 3 Pentagons/other) ---
      - type: Polygon # Triangle 1
        parameters: {p_in: [[1.0, 6.0], [2.0, 7.5], [3.0, 6.0]]}
      - type: Polygon # Triangle 2
        parameters: {p_in: [[4.0, 8.0], [5.0, 9.5], [6.0, 8.0]]}
      - type: Polygon # Triangle 3
        parameters: {p_in: [[7.5, 6.5], [8.5, 8.0], [9.5, 6.5]]}
      - type: Polygon # Pentagon 1
        parameters: {p_in: [[1.5, 1.5], [0.8, 2.5], [1.5, 3.5], [2.5, 3.0], [2.5, 2.0]]}
      - type: Polygon # Pentagon 2
        parameters: {p_in: [[4.0, 1.0], [3.5, 2.0], [4.5, 3.0], [5.5, 2.5], [5.0, 1.0]]}
      - type: Polygon # Hexagon
        parameters: {p_in: [[7.0, 1.5], [6.5, 2.5], [7.5, 3.5], [8.5, 3.0], [8.5, 2.0], [8.0, 1.0]]}

      # --- Rectangles (10) ---
      - type: Rectangle
        parameters: {xlim: [0.5, 1.5], ylim: [8.5, 9.5]}
      - type: Rectangle
        parameters: {xlim: [2.0, 3.5], ylim: [8.5, 9.8]}
      - type: Rectangle
        parameters: {xlim: [6.5, 7.5], ylim: [8.0, 9.5]}
      - type: Rectangle
        parameters: {xlim: [8.0, 9.5], ylim: [8.5, 9.8]}
      - type: Rectangle
        parameters: {xlim: [0.2, 1.2], ylim: [6.8, 7.8]}
      - type: Rectangle
        parameters: {xlim: [2.5, 3.5], ylim: [0.5, 1.5]}
      - type: Rectangle
        parameters: {xlim: [6.0, 7.0], ylim: [0.2, 1.2]}
      - type: Rectangle
        parameters: {xlim: [8.0, 9.0], ylim: [1.2, 2.8]}
      - type: Rectangle
        parameters: {xlim: [4.5, 5.5], ylim: [7.0, 8.0]}
      - type: Rectangle
        parameters: {xlim: [5.2, 6.2], ylim: [3.2, 4.2]}

      # --- Circles (4) ---
      - type: Circle
        parameters: {center: [0.8, 4.5], radius: 0.6}
      - type: Circle
        parameters: {center: [9.2, 4.5], radius: 0.6}
      - type: Circle
        parameters: {center: [1.5, 9.2], radius: 0.4}
      - type: Circle
        parameters: {center: [8.5, 0.8], radius: 0.5}
